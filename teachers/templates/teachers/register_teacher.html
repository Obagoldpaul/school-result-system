{% extends 'base.html' %}
{% block title %}Register Teacher{% endblock %}
{% block content %}
<h1>Register New Teacher</h1>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save Teacher</button>
</form>
<p><a href="{% url 'teacher_list' %}">View all teachers</a></p>
{% endblock %}
