{% extends 'base.html' %}
{% block title %}Subjects{% endblock %}
{% block content %}
<h1>All Subjects</h1>
<p><a href="{% url 'add_subject' %}">+ Add New Subject</a></p>
<p><a href="{% url 'assign_subject_to_class' %}">Assign Subject to Class</a></p>
<table>
    <tr>
        <th>Name</th>
        <th>Code</th>
    </tr>
    {% for subject in subjects %}
    <tr>
        <td>{{ subject.name }}</td>
        <td>{{ subject.code|default:"-" }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
