{% extends 'base.html' %}
{% block title %}Class Subjects{% endblock %}
{% block content %}
<h1>Class - Subject Assignments</h1>
<p><a href="{% url 'assign_subject_to_class' %}">+ New Assignment</a></p>
<table>
    <tr>
        <th>Class</th>
        <th>Subject</th>
    </tr>
    {% for cs in class_subjects %}
    <tr>
        <td>{{ cs.school_class }}</td>
        <td>{{ cs.subject }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
