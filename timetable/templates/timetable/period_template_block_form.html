{% extends "base.html" %}

{% block title %}{{ action }} Period Block{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h1>{{ action }} Period Block</h1>

            <p class="text-muted mb-0">
                {{ template.name }} — {{ block.day.get_day_display }}
            </p>
        </div>

        <div>
            <a href="{% url 'timetable_period_template_configure' template.id %}"
               class="btn btn-secondary">
                Cancel
            </a>
        </div>

    </div>


    <div class="row">

        <div class="col-lg-6">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h5 class="card-title mb-4">
                        Period Block Details
                    </h5>

                    <form method="post">

                        {% csrf_token %}

                        {{ form.as_p }}

                        <div class="d-flex gap-2 mt-3">

                            <button type="submit"
                                    class="btn btn-primary">
                                Save Changes
                            </button>

                            <a href="{% url 'timetable_period_template_configure' template.id %}"
                               class="btn btn-secondary">
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
