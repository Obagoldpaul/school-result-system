<!DOCTYPE html>
<html>
<head>
    <title>Students</title>
</head>
<body>
    <h1>All Students</h1>
    <p><a href="{% url 'register_student' %}">+ Register New Student</a></p>
    <table border="1" cellpadding="8">
        <tr>
            <th>Admission No.</th>
            <th>Name</th>
            <th>Class</th>
            <th>Department</th>
        </tr>
        {% for student in students %}
        <tr>
            <td>{{ student.admission_number }}</td>
            <td>{{ student.user.get_full_name }}</td>
            <td>{{ student.school_class }}</td>
            <td>{{ student.department|default:"-" }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
