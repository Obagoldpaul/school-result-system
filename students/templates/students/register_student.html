<!DOCTYPE html>
<html>
<head>
    <title>Register Student</title>
</head>
<body>
    <h1>Register New Student</h1>

        {% csrf_token %}
        {{ form.as_p }}

    <p><a href="{% url 'student_list' %}">View all students</a></p>
</body>
</html>
