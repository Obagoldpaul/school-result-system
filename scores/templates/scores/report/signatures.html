<div class="signature-box">

    <!-- Class Teacher -->
    <div class="box" style="text-align:center;">

        <strong>Class Teacher's Comment:</strong>

        <br><br>

        {{ extra.teacher_remark|default:"-" }}

    </div>

    <!-- Principal -->
    <div class="box" style="text-align:center;">

        <strong>Principal's Remark:</strong>

        <br><br>

        {{ extra.principal_remark|default:"-" }}

        <br><br>

        {% if school_settings.principal_signature %}
            <img src="{{ school_settings.principal_signature.url }}"
                 alt="Principal Signature"
                 style="height:40px;">
            <br>
        {% endif %}

        <strong>{{ school_settings.principal_name|default:"Principal" }}</strong>

        <br>

        <small>Principal</small>

    </div>

</div>
