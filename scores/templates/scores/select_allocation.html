{% extends 'base.html' %}
{% block title %}Select Class/Subject{% endblock %}
{% block content %}
<h1>Select Class & Subject to Enter Scores</h1>
<table>
    <tr>
        <th>Subject</th>
        <th>Class</th>
        <th>Term</th>
        <th>Action</th>
    </tr>
    {% for a in allocations %}
    <tr>
        <td>{{ a.subject }}</td>
        <td>{{ a.school_class }}</td>
        <td>{{ a.term }}</td>
        <td><a href="{% url 'enter_scores' a.id %}">Enter Scores</a></td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
